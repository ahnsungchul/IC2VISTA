<!DOCTYPE HTML>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="shortcut icon" href="../img/inc/favicon.ico" type="image/x-icon">
<title>IC2VISTA</title>
<script type="text/javascript" src="../resources/js/jquery-1.11.2.min.js"></script>
<script type="text/javascript" src="../resources/js/jquery-ui.js"></script>
<script type="text/javascript" src="../resources/js/common.js"></script>
<link rel="stylesheet" type="text/css" href="../resources/css/common.css">
<link rel="stylesheet" type="text/css" href="../resources/css/jquery-ui.css">
<link rel="stylesheet" type="text/css" href="../resources/css/layout.css">
<link rel="stylesheet" type="text/css" href="../resources/css/template.css">
</head>
<body>

    <div id="login-wrap">
        <div class="visual-box ship"><!--이미지:drone,ship,robot-->
        </div>
        <div class="login-box">
            <div class="flex-col-w500">
                <i class="ico ico-logo-285-50"></i>
                <p class="txt-fw700-fs30-fc000000-lh10 m_t_67">IC2VISTA에 오신것을 환영합니다.</p>
                <p class="txt-fw500-fs16-fc5F627B-lh10 m_t_37">로그인하려면 <span class="txt-fc000000">아이디와 비밀번호</span>를 입력하세요.</p>
                <div class="flex-col-gap8 m_t_43">
                    <p class="txt-fw600-fs17-fc000000-lh10">이메일</p>
                    <input type="text" class="input-h65-type1 input-email" placeholder="이메일 주소를 입력해주시기 바랍니다." >
                </div>
                <div class="flex-col-gap8 m_t_30">
                    <p class="txt-fw600-fs17-fc000000-lh10">비밀번호</p>
                    <input type="text" class="input-h65-type1 input-password" placeholder="비밀번호를 입력해주시기 바랍니다." >
                </div>
                <button type="button" class="btn-h65-bg153457-br5px m_t_31">
                    <span class="txt-fw600-fs20-fcFFFFFF-lh10">로그인</span>
                </button>
                <div class="flex-sb m_t_18">
                    <button type="button" class="btn-txt">
                        <span class="txt-fw600-fs16-fc000000-lh10">계정생성</span>
                    </button>
                    <button type="button" class="btn-txt">
                        <span class="txt-fw600-fs16-fc000000-lh10">비밀번호 초기화</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
